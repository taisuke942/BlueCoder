<!doctype html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>検索するフォルダを選択</title>
  <style>
    :root{--ink:#173349;--muted:#607585;--border:#dbe5ec;--accent:#087f76;--soft:#edf7f5;--bg:#f5f8fa}
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{color:var(--ink);background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",Meiryo,sans-serif;font-size:14px;line-height:1.55;overflow:hidden}button{font:inherit;cursor:pointer}button:disabled{cursor:default;opacity:.48}button:focus-visible{outline:3px solid #d8a12c;outline-offset:2px}.app{display:flex;flex-direction:column;height:100%;min-height:360px}.header{padding:18px 22px 12px;border-bottom:1px solid var(--border);flex-shrink:0}.eyebrow{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.07em;margin-bottom:4px}.heading-row{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:20px;line-height:1.5;margin:0;font-weight:750}.drive-badge{font-size:12px;color:#476677;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:5px 9px;max-width:46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.intro{color:var(--muted);font-size:12px;margin:7px 0 0}.navigation{padding:12px 22px 10px;flex-shrink:0;background:#fbfcfd}.nav-row{display:flex;gap:8px;align-items:center}.nav-button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;padding:6px 11px;background:#fff;border:1px solid #cfdde5;border-radius:7px;color:#35576c;font-size:12px;white-space:nowrap}.nav-button:not(:disabled):hover{background:#eef5f8}.nav-button svg{width:15px;height:15px;flex-shrink:0}.breadcrumbs{display:flex;align-items:center;gap:3px;overflow-x:auto;white-space:nowrap;min-width:0;flex:1;padding:3px 2px;scrollbar-width:thin}.crumb{padding:5px 7px;border:0;border-radius:5px;background:transparent;color:#356b83;font-size:12px;max-width:180px;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}.crumb:not(:disabled):hover{background:#eaf2f6}.crumb.current{color:var(--ink);font-weight:700;opacity:1}.crumb-separator{font-size:14px;color:#8a9daa;flex-shrink:0}.path-row{display:flex;align-items:baseline;gap:10px;margin-top:10px}.path-label{color:var(--muted);font-size:11px;white-space:nowrap}.path{font-size:12px;font-weight:600;overflow-wrap:anywhere;max-height:3.2em;overflow:auto;min-width:0;line-height:1.6;margin:0}.notices{flex-shrink:0;padding:0 22px}.notice{font-size:12px;line-height:1.6;margin-top:10px;padding:9px 11px;border-radius:7px;max-height:90px;overflow:auto}.notice[hidden]{display:none}.warning{background:#fff8e6;color:#745924;border:1px solid #f0dfad}.error{background:#fff2f1;color:#8e3e3a;border:1px solid #ebcfcc;display:flex;gap:12px;align-items:flex-start}.error-message{min-width:0;flex:1;overflow-wrap:anywhere}.retry{padding:4px 9px;background:#fff;border:1px solid #d9aaa6;border-radius:5px;color:#873b36;font-size:12px;white-space:nowrap;flex-shrink:0}.content{display:flex;flex-direction:column;flex:1;min-height:0;padding:12px 22px 0}.list-caption{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-shrink:0;color:var(--muted);font-size:11px;margin-bottom:7px}.list-caption h2{font-size:12px;margin:0;font-weight:600;color:#526d7f}.folder-area{flex:1;min-height:60px;overflow-y:auto;border:1px solid var(--border);border-radius:9px;background:#fff}.folder-list{list-style:none;margin:0;padding:4px}.folder-item{margin:0}.folder-button{display:flex;align-items:center;gap:11px;width:100%;min-height:44px;padding:9px 11px;border:0;border-radius:6px;text-align:left;color:var(--ink);background:#fff}.folder-button:not(:disabled):hover{background:#eef6f7}.folder-icon{width:22px;height:20px;flex-shrink:0;color:#c49425}.folder-name{flex:1;min-width:0;overflow-wrap:anywhere;font-size:13px}.folder-chevron{color:#7f98a8;font-size:20px;line-height:1;flex-shrink:0}.empty{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:9px;min-height:150px;height:100%;padding:20px;text-align:center;color:var(--muted);font-size:13px}.empty p{margin:0;max-width:410px}.empty .small{font-size:12px;color:#7a8d99}.spinner{width:24px;height:24px;border:3px solid #e1edee;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}.pagination{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0 11px;flex-shrink:0;min-height:52px}.page-info{font-size:12px;color:var(--muted)}.page-buttons{display:flex;gap:7px}.footer{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 22px 16px;border-top:1px solid var(--border);background:#fff;flex-shrink:0}.selection-note{font-size:11px;line-height:1.6;color:var(--muted);max-width:185px}.actions{display:flex;gap:9px;align-items:center}.button{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:9px 16px;border:1px solid transparent;border-radius:8px;font-size:13px;font-weight:650;line-height:1.5}.button.secondary{background:#fff;border-color:#ccdbe4;color:#486477}.button.secondary:not(:disabled):hover{background:#f3f7f9}.button.primary{background:var(--accent);color:#fff}.button.primary:not(:disabled):hover{background:#066a62}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;clip-path:inset(50%)}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:570px){.header{padding:14px 15px 11px}.heading-row{align-items:flex-start;flex-direction:column;gap:6px}h1{font-size:18px}.drive-badge{max-width:100%;padding:3px 8px}.intro{font-size:11px}.navigation{padding:10px 15px}.nav-row{flex-wrap:wrap}.breadcrumbs{flex-basis:100%;order:3;padding-top:5px}.nav-button{font-size:11px;min-height:31px}.notices{padding:0 15px}.content{padding:10px 15px 0}.footer{padding:11px 15px 13px;gap:9px}.selection-note{display:none}.actions{width:100%;justify-content:flex-end}.button{font-size:12px;padding:9px 12px}.button.primary{flex:1;max-width:310px}.crumb{max-width:150px}.empty{min-height:100px}}
    @media(prefers-reduced-motion:reduce){.spinner{animation:none}}
  </style>
</head>
<body>
<main class="app" aria-labelledby="title">
  <header class="header">
    <div class="eyebrow">検索範囲</div>
    <div class="heading-row"><h1 id="title">検索するフォルダを選択</h1><div class="drive-badge" id="drive-name">共有ドライブ</div></div>
    <p class="intro">フォルダ名をクリックして開き、目的の場所で下の選択ボタンを押してください。</p>
  </header>
  <section class="navigation" aria-label="フォルダの移動">
    <div class="nav-row">
      <button type="button" class="nav-button" id="root-button" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5M5.5 9.5V21h13V9.5M9 21v-7h6v7"/></svg>先頭へ</button>
      <button type="button" class="nav-button" id="up-button" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m5 10 7-7 7 7M12 3v18"/></svg>上へ</button>
      <nav class="breadcrumbs" id="breadcrumbs" aria-label="現在の階層"></nav>
    </div>
    <div class="path-row"><span class="path-label">現在の場所</span><p class="path" id="current-path">読み込み中…</p></div>
  </section>
  <div class="notices">
    <div class="notice warning" id="warning" role="status" hidden></div>
    <div class="notice error" id="error" role="alert" hidden><span class="error-message" id="error-message"></span><button class="retry" type="button" id="retry-button">再試行</button></div>
  </div>
  <section class="content" aria-labelledby="list-title">
    <div class="list-caption"><h2 id="list-title">この場所にあるフォルダ</h2><span id="folder-count"></span></div>
    <div class="folder-area" id="folder-area" aria-busy="true"><div class="empty"><span class="spinner" aria-hidden="true"></span><p>フォルダを読み込んでいます…</p></div></div>
    <div class="pagination"><span class="page-info" id="page-info"></span><div class="page-buttons"><button class="nav-button" type="button" id="previous-button" disabled>前のページ</button><button class="nav-button" type="button" id="next-button" disabled>次のページ</button></div></div>
  </section>
  <footer class="footer"><span class="selection-note">選んだ場所と、その下の階層を<br>検索範囲に設定します。</span><div class="actions"><button class="button secondary" type="button" id="close-button">閉じる</button><button class="button primary" type="button" id="select-button" disabled>このフォルダを選択</button></div></footer>
  <div class="visually-hidden" id="live-status" role="status" aria-live="polite"></div>
</main>
<script>
(function () {
  'use strict';

  var elements = {};
  [
    'drive-name', 'root-button', 'up-button', 'breadcrumbs', 'current-path',
    'warning', 'error', 'error-message', 'retry-button', 'folder-count',
    'folder-area', 'page-info', 'previous-button', 'next-button',
    'close-button', 'select-button', 'live-status'
  ].forEach(function (id) { elements[id] = document.getElementById(id); });

  var state = {
    requestSeq: 0,
    closed: false,
    loading: false,
    saving: false,
    validView: false,
    page: null,
    pageIndex: 0,
    pageTokens: [null],
    lastRequest: null,
    retryAction: null
  };

  function isBusy() {
    return state.loading || state.saving;
  }

  function getParentId() {
    if (!state.page || state.page.folderId === state.page.rootId) return null;
    var crumbs = state.page.breadcrumbs;
    return crumbs.length > 1 ? crumbs[crumbs.length - 2].id : null;
  }

  function syncControls() {
    var busy = isBusy();
    var page = state.page;
    elements['root-button'].disabled = busy || !page;
    elements['up-button'].disabled = busy || !getParentId();
    elements['previous-button'].disabled = busy || !state.validView || state.pageIndex === 0;
    elements['next-button'].disabled = busy || !state.validView || !page || !page.nextPageToken;
    elements['select-button'].disabled = busy || !state.validView || !page;
    elements['close-button'].disabled = state.saving;
    elements['retry-button'].disabled = busy;
    elements['select-button'].textContent = state.saving
      ? '設定しています…'
      : (page && page.folderId === page.rootId ? '共有ドライブ全体を選択' : 'このフォルダを選択');
    elements['folder-area'].setAttribute('aria-busy', String(busy));
    elements['breadcrumbs'].querySelectorAll('button').forEach(function (button) {
      button.disabled = busy || button.getAttribute('aria-current') === 'page';
    });
    elements['folder-area'].querySelectorAll('button').forEach(function (button) {
      button.disabled = busy || !state.validView;
    });
  }

  function errorText(error) {
    if (error && typeof error.message === 'string') return error.message;
    if (typeof error === 'string') return error;
    return '処理を完了できませんでした。もう一度お試しください。';
  }

  function clearError() {
    elements['error'].hidden = true;
    elements['error-message'].textContent = '';
    state.retryAction = null;
  }

  function showError(error, retryAction) {
    elements['error-message'].textContent = errorText(error);
    elements['error'].hidden = false;
    state.retryAction = retryAction;
  }

  function showEmpty(message, detail, loading) {
    var empty = document.createElement('div');
    empty.className = 'empty';
    if (loading) {
      var spinner = document.createElement('span');
      spinner.className = 'spinner';
      spinner.setAttribute('aria-hidden', 'true');
      empty.appendChild(spinner);
    }
    var paragraph = document.createElement('p');
    paragraph.textContent = message;
    empty.appendChild(paragraph);
    if (detail) {
      var hint = document.createElement('p');
      hint.className = 'small';
      hint.textContent = detail;
      empty.appendChild(hint);
    }
    elements['folder-area'].replaceChildren(empty);
  }

  function normalizePage(data) {
    if (!data || typeof data !== 'object' || !data.rootId || !data.folderId ||
        !Array.isArray(data.breadcrumbs) || !Array.isArray(data.folders)) {
      throw new Error('フォルダの情報を取得できませんでした。再試行してください。');
    }
    var validItem = function (item) {
      return item && typeof item.id === 'string' && item.id.length > 0 && typeof item.name === 'string';
    };
    if (!data.breadcrumbs.every(validItem) || !data.folders.every(validItem) ||
        typeof data.rootId !== 'string' || typeof data.folderId !== 'string' ||
        typeof data.path !== 'string') {
      throw new Error('フォルダの情報を正しく読み取れませんでした。再試行してください。');
    }
    return {
      rootId: data.rootId,
      rootName: String(data.rootName || '共有ドライブ'),
      folderId: data.folderId,
      folderName: String(data.folderName || 'フォルダ'),
      path: data.path,
      breadcrumbs: data.breadcrumbs,
      folders: data.folders,
      nextPageToken: typeof data.nextPageToken === 'string' ? data.nextPageToken : '',
      warning: typeof data.warning === 'string' ? data.warning : ''
    };
  }

  function folderIcon() {
    var ns = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', '0 0 24 22');
    svg.setAttribute('class', 'folder-icon');
    svg.setAttribute('aria-hidden', 'true');
    var path = document.createElementNS(ns, 'path');
    path.setAttribute('d', 'M2 5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2Z');
    path.setAttribute('fill', '#fff0b8');
    path.setAttribute('stroke', 'currentColor');
    path.setAttribute('stroke-width', '1.4');
    svg.appendChild(path);
    return svg;
  }

  function renderPage() {
    var page = state.page;
    elements['drive-name'].textContent = page.rootName;
    elements['drive-name'].title = page.rootName;
    elements['current-path'].textContent = page.path;
    elements['current-path'].title = page.path;
    elements['warning'].textContent = page.warning;
    elements['warning'].hidden = !page.warning;
    elements['breadcrumbs'].replaceChildren();
    page.breadcrumbs.forEach(function (crumb, index) {
      if (index) {
        var separator = document.createElement('span');
        separator.className = 'crumb-separator';
        separator.textContent = '›';
        separator.setAttribute('aria-hidden', 'true');
        elements['breadcrumbs'].appendChild(separator);
      }
      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'crumb';
      button.textContent = crumb.name || '（名前なし）';
      button.title = crumb.name;
      if (crumb.id === page.folderId) {
        button.classList.add('current');
        button.setAttribute('aria-current', 'page');
        button.disabled = true;
      } else {
        button.addEventListener('click', function () { openFolder(crumb.id); });
      }
      elements['breadcrumbs'].appendChild(button);
    });

    elements['folder-count'].textContent = page.folders.length.toLocaleString('ja-JP') + 'フォルダ';
    elements['page-info'].textContent = (state.pageIndex + 1).toLocaleString('ja-JP') + 'ページ目';
    if (!page.folders.length) {
      var message = 'このページにフォルダはありません。';
      var detail = page.nextPageToken
        ? '「次のページ」で続きを確認できます。'
        : '現在の場所を選択することはできます。';
      if (state.pageIndex === 0 && !page.nextPageToken) {
        message = 'この場所の直下にフォルダはありません。';
      }
      showEmpty(message, detail, false);
    } else {
      var list = document.createElement('ul');
      list.className = 'folder-list';
      page.folders.forEach(function (folder) {
        var item = document.createElement('li');
        item.className = 'folder-item';
        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'folder-button';
        button.setAttribute('aria-label', (folder.name || '名前なしのフォルダ') + ' を開く');
        button.appendChild(folderIcon());
        var name = document.createElement('span');
        name.className = 'folder-name';
        name.textContent = folder.name || '（名前なし）';
        button.appendChild(name);
        var chevron = document.createElement('span');
        chevron.className = 'folder-chevron';
        chevron.textContent = '›';
        chevron.setAttribute('aria-hidden', 'true');
        button.appendChild(chevron);
        button.addEventListener('click', function () { openFolder(folder.id); });
        item.appendChild(button);
        list.appendChild(item);
      });
      elements['folder-area'].replaceChildren(list);
    }
    elements['folder-area'].scrollTop = 0;
    elements['breadcrumbs'].scrollLeft = elements['breadcrumbs'].scrollWidth;
    elements['live-status'].textContent = page.path + '、' + page.folders.length + 'フォルダを表示しました。';
    syncControls();
  }

  function requestPage(request) {
    if (state.closed || state.saving) return;
    var requestSeq = ++state.requestSeq;
    state.lastRequest = {
      folderId: request.folderId,
      pageToken: request.pageToken,
      pageIndex: request.pageIndex,
      pageTokens: request.pageTokens.slice()
    };
    state.loading = true;
    state.validView = false;
    clearError();
    elements['warning'].hidden = true;
    elements['folder-count'].textContent = '';
    elements['live-status'].textContent = 'フォルダを読み込んでいます。';
    showEmpty('フォルダを読み込んでいます…', '', true);
    syncControls();

    function fail(error) {
      if (state.closed || requestSeq !== state.requestSeq) return;
      state.loading = false;
      state.validView = false;
      showEmpty('フォルダを読み込めませんでした。', '再試行するか、先頭・上の階層へ移動してください。', false);
      showError(error, function () { requestPage(state.lastRequest); });
      elements['live-status'].textContent = 'フォルダの読み込みに失敗しました。';
      syncControls();
    }

    try {
      google.script.run
        .withSuccessHandler(function (data) {
          if (state.closed || requestSeq !== state.requestSeq) return;
          var page;
          try { page = normalizePage(data); } catch (error) { fail(error); return; }
          state.page = page;
          state.pageIndex = request.pageIndex;
          state.pageTokens = request.pageTokens.slice();
          state.loading = false;
          state.validView = true;
          clearError();
          renderPage();
        })
        .withFailureHandler(fail)
        .getFolderPickerPage(request.folderId, request.pageToken);
    } catch (error) {
      fail(error);
    }
  }

  function openFolder(folderId) {
    if (isBusy() || state.closed) return;
    requestPage({folderId: folderId, pageToken: null, pageIndex: 0, pageTokens: [null]});
  }

  function selectCurrentFolder() {
    if (isBusy() || state.closed || !state.validView || !state.page) return;
    var folderId = state.page.folderId;
    var requestSeq = ++state.requestSeq;
    state.saving = true;
    clearError();
    elements['live-status'].textContent = '検索範囲を設定しています。';
    syncControls();

    function fail(error) {
      if (state.closed || requestSeq !== state.requestSeq) return;
      state.saving = false;
      showError(error, selectCurrentFolder);
      elements['live-status'].textContent = '検索範囲を設定できませんでした。';
      syncControls();
    }

    try {
      google.script.run
        .withSuccessHandler(function (result) {
          if (state.closed || requestSeq !== state.requestSeq) return;
          if (!result || result.id !== folderId || typeof result.path !== 'string') {
            fail(new Error('検索範囲の設定結果を確認できませんでした。再試行してください。'));
            return;
          }
          state.closed = true;
          state.requestSeq++;
          google.script.host.close();
        })
        .withFailureHandler(fail)
        .selectSearchFolder(folderId);
    } catch (error) {
      fail(error);
    }
  }

  elements['root-button'].addEventListener('click', function () {
    if (state.page) openFolder(state.page.rootId);
  });
  elements['up-button'].addEventListener('click', function () {
    var parentId = getParentId();
    if (parentId) openFolder(parentId);
  });
  elements['previous-button'].addEventListener('click', function () {
    if (isBusy() || !state.validView || state.pageIndex === 0) return;
    var index = state.pageIndex - 1;
    requestPage({
      folderId: state.page.folderId,
      pageToken: state.pageTokens[index],
      pageIndex: index,
      pageTokens: state.pageTokens.slice(0, index + 1)
    });
  });
  elements['next-button'].addEventListener('click', function () {
    if (isBusy() || !state.validView || !state.page || !state.page.nextPageToken) return;
    var index = state.pageIndex + 1;
    var tokens = state.pageTokens.slice(0, index);
    tokens.push(state.page.nextPageToken);
    requestPage({
      folderId: state.page.folderId,
      pageToken: state.page.nextPageToken,
      pageIndex: index,
      pageTokens: tokens
    });
  });
  elements['retry-button'].addEventListener('click', function () {
    if (!isBusy() && state.retryAction) state.retryAction();
  });
  elements['select-button'].addEventListener('click', selectCurrentFolder);
  elements['close-button'].addEventListener('click', function () {
    if (state.saving || state.closed) return;
    state.closed = true;
    state.requestSeq++;
    google.script.host.close();
  });

  requestPage({folderId: null, pageToken: null, pageIndex: 0, pageTokens: [null]});
})();
</script>
</body>
</html>
